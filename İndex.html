<!DOCTYPE html>

<html lang="tr" class="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0B0F14">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="Sadece 60 Gün">

    <title>Sadece 60 Gün</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>

        tailwind.config = {

            darkMode: 'class',

            theme: {

                extend: {

                    fontFamily: {

                        sans: ['Inter', 'sans-serif'],

                    },

                    colors: {

                        appBg: '#0B0F14',

                        cardBg: '#131922',

                        cardHover: '#19212C',

                        borderDark: '#1F2937',

                        emeraldAccent: '#10B981',

                        goldAccent: '#F59E0B',

                    }

                }

            }

        }

    </script>

    <style>

        body {

            background-color: #05070A;

            color: #F3F4F6;

            font-family: 'Inter', sans-serif;

            -webkit-tap-highlight-color: transparent;

            user-select: none;

        }

        ::-webkit-scrollbar {

            width: 4px;

            height: 4px;

        }

        ::-webkit-scrollbar-track {

            background: #0B0F14;

        }

        ::-webkit-scrollbar-thumb {

            background: #1F2937;

            border-radius: 10px;

        }

        .modal-enter {

            animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        }

        @keyframes slideUp {

            from { opacity: 0; transform: translateY(14px) scale(0.98); }

            to { opacity: 1; transform: translateY(0) scale(1); }

        }

        .water-bar-fill {

            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

            background: linear-gradient(90deg, #0284C7 0%, #38BDF8 100%);

        }

    </style>

</head>

<body class="min-h-screen flex justify-center items-start sm:py-5">



    <!-- Mobile App Container -->

    <div id="app-container" class="w-full max-w-md min-h-screen sm:min-h-[860px] bg-appBg sm:rounded-[34px] sm:border sm:border-borderDark sm:shadow-2xl flex flex-col relative overflow-hidden">

        

        <!-- Toast Notification -->

        <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2 w-max max-w-[90vw]">

            <div class="bg-[#18202C] border border-emeraldAccent/60 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 text-xs sm:text-sm font-semibold">

                <svg class="w-4 h-4 text-emeraldAccent shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>

                <span id="toast-msg">Kaydedildi</span>

            </div>

        </div>



        <!-- In-App Meal Alarm Banner -->

        <div id="meal-alarm-banner" class="hidden bg-gradient-to-r from-emerald-950 via-[#11241E] to-amber-950/60 border-b border-emeraldAccent/50 px-4 py-3 z-30">

            <div class="flex items-center justify-between gap-3">

                <div class="flex items-center gap-2.5">

                    <div class="w-9 h-9 rounded-xl bg-emeraldAccent text-appBg flex items-center justify-center shrink-0 animate-bounce">

                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

                    </div>

                    <div>

                        <p class="text-[11px] font-bold uppercase tracking-wider text-emeraldAccent">Öğün Vakti Geldi!</p>

                        <p id="alarm-banner-text" class="text-xs sm:text-sm font-extrabold text-white">08:30 - Kahvaltı</p>

                    </div>

                </div>

                <button onclick="dismissAlarmBanner()" class="px-3 py-1.5 rounded-lg bg-appBg/90 border border-borderDark text-xs font-bold text-gray-200 hover:text-white">

                    Tamam

                </button>

            </div>

        </div>



        <!-- Top Header -->

        <header class="px-4 pt-5 pb-3.5 bg-gradient-to-b from-[#111720] to-appBg border-b border-borderDark/80 sticky top-0 z-20 backdrop-blur-md">

            <!-- Brand & Header Action Buttons -->

            <div class="flex items-center justify-between mb-3.5">

                <div class="flex items-center gap-2.5">

                    <!-- Custom Shield + 60 + Stopwatch Emblem -->

                    <div onclick="openBrandModal()" class="w-11 h-11 rounded-2xl bg-[#0D131A] border border-emeraldAccent/45 flex items-center justify-center shadow-lg cursor-pointer active:scale-95 transition" title="Uygulama İkonu ve Kurulum">

                        <svg width="34" height="34" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

                            <defs>

                                <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">

                                    <stop offset="0%" stop-color="#1E293B"/>

                                    <stop offset="100%" stop-color="#0B0F14"/>

                                </linearGradient>

                                <linearGradient id="emeraldGold" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">

                                    <stop offset="0%" stop-color="#10B981"/>

                                    <stop offset="55%" stop-color="#34D399"/>

                                    <stop offset="100%" stop-color="#F59E0B"/>

                                </linearGradient>

                            </defs>

                            <path d="M32 4L54 12V30C54 44.5 44.6 56.2 32 60C19.4 56.2 10 44.5 10 30V12L32 4Z" fill="url(#shieldGrad)" stroke="url(#emeraldGold)" stroke-width="3.2" stroke-linejoin="round"/>

                            <path d="M20 22C23.2 18.2 27.4 16 32 16C36.6 16 40.8 18.2 44 22" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"/>

                            <path d="M32 9L34.2 12.8L32 14.5L29.8 12.8L32 9Z" fill="#F59E0B"/>

                            <text x="32" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="900" font-size="20" letter-spacing="-1">60</text>

                            <rect x="22" y="45" width="20" height="3" rx="1.5" fill="#10B981"/>

                        </svg>

                    </div>

                    <div>

                        <div class="flex items-center gap-1.5">

                            <h1 class="text-base sm:text-lg font-black tracking-tight text-white leading-none">Sadece 60 Gün</h1>

                            <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-goldAccent/15 text-goldAccent border border-goldAccent/30">PRO</span>

                        </div>

                        <p class="text-[11px] text-gray-400 mt-1 font-medium">Disiplin & Hedef Takip Sistemi</p>

                    </div>

                </div>



                <!-- Right Action Buttons: Audio/Music, Notifications, App Icon -->

                <div class="flex items-center gap-1.5">

                    <button onclick="openAudioModal()" id="audio-header-btn" class="p-2.5 rounded-xl bg-cardBg hover:bg-cardHover border border-borderDark text-gray-300 hover:text-emeraldAccent transition relative active:scale-95" title="Ses Efektleri & Fon Müzikleri">

                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

                        <span id="bgm-active-dot" class="hidden w-2 h-2 rounded-full bg-emeraldAccent animate-ping absolute top-2 right-2"></span>

                        <span id="bgm-static-dot" class="hidden w-2 h-2 rounded-full bg-emeraldAccent absolute top-2 right-2"></span>

                    </button>

                    <button onclick="openNotifModal()" id="notif-header-btn" class="p-2.5 rounded-xl bg-cardBg hover:bg-cardHover border border-borderDark text-gray-300 hover:text-emeraldAccent transition relative active:scale-95" title="Öğün Bildirimleri">

                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

                        <span id="notif-status-dot" class="w-2 h-2 rounded-full bg-goldAccent absolute top-2 right-2"></span>

                    </button>

                    <button onclick="openBrandModal()" class="p-2.5 rounded-xl bg-cardBg hover:bg-cardHover border border-borderDark text-gray-300 hover:text-goldAccent transition active:scale-95" title="İkonu İndir / Telefona Kur">

                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>

                    </button>

                </div>

            </div>



            <!-- 60-Day Timeline Navigator (< Önceki / GÜN X / 60 / Sonraki >) -->

            <div class="bg-cardBg border border-borderDark rounded-2xl p-2 flex items-center justify-between gap-1.5">

                <button onclick="changeDay(-1)" id="btn-prev-day" class="px-2.5 py-2 rounded-xl bg-appBg hover:bg-gray-800 disabled:opacity-35 disabled:pointer-events-none border border-borderDark text-gray-200 text-xs font-bold flex items-center gap-1 transition active:scale-95">

                    <svg class="w-3.5 h-3.5 text-goldAccent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>

                    <span>Önceki</span>

                </button>



                <button onclick="openDayGridModal()" class="flex-1 py-1.5 px-2 rounded-xl hover:bg-appBg/70 transition flex flex-col items-center justify-center group">

                    <div class="flex items-center gap-1.5">

                        <span class="text-xs font-extrabold text-goldAccent tracking-wider">GÜN</span>

                        <span id="header-day-text" class="text-base font-black text-white">1 / 60</span>

                        <svg class="w-3.5 h-3.5 text-gray-400 group-hover:text-emeraldAccent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

                    </div>

                    <div class="w-full max-w-[140px] h-1.5 bg-appBg rounded-full overflow-hidden mt-1 border border-borderDark/70">

                        <div id="marathon-bar" class="h-full bg-gradient-to-r from-emeraldAccent to-goldAccent rounded-full transition-all duration-300" style="width: 2%"></div>

                    </div>

                </button>



                <button onclick="changeDay(1)" id="btn-next-day" class="px-2.5 py-2 rounded-xl bg-appBg hover:bg-gray-800 disabled:opacity-35 disabled:pointer-events-none border border-borderDark text-gray-200 text-xs font-bold flex items-center gap-1 transition active:scale-95">

                    <span>Sonraki</span>

                    <svg class="w-3.5 h-3.5 text-emeraldAccent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

                </button>

            </div>

        </header>



        <!-- Main Scrollable Content -->

        <main class="flex-1 px-4 pt-4 pb-28 space-y-5 overflow-y-auto">



            <!-- ================= TAB 1: GÜNLÜK PLAN ================= -->

            <div id="tab-daily" class="space-y-5">



                <!-- Daily Progress & Discipline Score Card -->

                <div class="bg-gradient-to-r from-cardBg via-[#161E29] to-cardBg border border-borderDark rounded-2xl p-4">

                    <div class="flex items-center justify-between mb-2">

                        <div>

                            <span id="daily-date-label" class="text-[11px] font-bold uppercase tracking-wider text-emeraldAccent">1. Gün Disiplin Skoru</span>

                            <p id="daily-motivation-quote" class="text-xs text-gray-300 font-medium mt-0.5 line-clamp-1">"Bugün attığın her adım, 60. gündeki aynaya cevaptır."</p>

                        </div>

                        <div class="shrink-0 pl-3 border-l border-borderDark text-right">

                            <span id="daily-score-text" class="text-2xl font-black text-emeraldAccent">%0</span>

                        </div>

                    </div>

                    <div class="w-full h-2 bg-appBg rounded-full overflow-hidden border border-borderDark">

                        <div id="daily-score-bar" class="h-full bg-gradient-to-r from-emeraldAccent to-goldAccent rounded-full transition-all duration-300" style="width: 0%"></div>

                    </div>

                </div>

                

                <!-- Water Tracker Card -->

                <section class="bg-cardBg border border-borderDark rounded-2xl p-4 shadow-sm">

                    <div class="flex items-center justify-between mb-2.5">

                        <div class="flex items-center gap-2.5">

                            <div class="w-9 h-9 rounded-xl bg-sky-500/15 border border-sky-500/30 flex items-center justify-center text-sky-400">

                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>

                            </div>

                            <div>

                                <h2 class="text-sm font-bold text-white">Su Tüketimi</h2>

                                <p class="text-xs text-gray-400">Hedef: <span id="water-target-display" class="text-gray-200 font-bold">3000</span> ml</p>

                            </div>

                        </div>

                        <button onclick="openWaterModal()" class="p-2 text-gray-400 hover:text-white bg-appBg hover:bg-gray-800 rounded-xl border border-borderDark transition" title="Su Hedefini Ayarla">

                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>

                        </button>

                    </div>



                    <div class="mb-3">

                        <div class="flex justify-between items-baseline mb-1.5">

                            <span id="water-current-display" class="text-2xl font-black text-sky-400 tracking-tight">0 <span class="text-xs font-medium text-gray-400">ml</span></span>

                            <span id="water-percent-display" class="text-xs font-extrabold text-sky-300 bg-sky-500/15 px-2.5 py-0.5 rounded-lg">%0</span>

                        </div>

                        <div class="w-full h-3.5 bg-appBg rounded-full overflow-hidden border border-borderDark p-0.5">

                            <div id="water-bar" class="h-full water-bar-fill rounded-full" style="width: 0%"></div>

                        </div>

                    </div>



                    <div class="grid grid-cols-3 gap-2">

                        <button onclick="addWater(200)" class="py-2.5 px-2 bg-sky-500/10 hover:bg-sky-500/20 active:scale-95 border border-sky-500/30 rounded-xl text-sky-300 text-xs font-extrabold flex items-center justify-center gap-1 transition">

                            + 200 ml

                        </button>

                        <button onclick="addWater(500)" class="py-2.5 px-2 bg-sky-500/20 hover:bg-sky-500/30 active:scale-95 border border-sky-500/40 rounded-xl text-white text-xs font-extrabold flex items-center justify-center gap-1 transition">

                            + 500 ml

                        </button>

                        <button onclick="addWater(-200)" class="py-2.5 px-2 bg-appBg hover:bg-gray-800 active:scale-95 border border-borderDark rounded-xl text-gray-400 text-xs font-bold flex items-center justify-center gap-1 transition">

                            - 200 ml

                        </button>

                    </div>

                </section>



                <!-- Meals Schedule Section -->

                <section>

                    <div class="flex items-center justify-between mb-3 px-0.5">

                        <div class="flex items-center gap-2">

                            <svg class="w-5 h-5 text-emeraldAccent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>

                            <h2 class="text-base font-extrabold text-white">Öğün & Saat Planı</h2>

                        </div>

                        <button onclick="openMealModal()" class="bg-emeraldAccent hover:bg-emerald-500 active:scale-95 text-appBg font-extrabold text-xs px-3.5 py-2 rounded-xl flex items-center gap-1 shadow-md shadow-emeraldAccent/15 transition">

                            <span>+ Yeni Öğün Ekle</span>

                        </button>

                    </div>



                    <div id="meals-list" class="space-y-3">

                        <!-- Rendered dynamically -->

                    </div>

                </section>



                <!-- Daily Energy Mood & Discipline Note Card -->

                <section class="bg-cardBg border border-borderDark rounded-2xl p-4">

                    <div class="flex items-center justify-between mb-3">

                        <div class="flex items-center gap-2">

                            <svg class="w-4 h-4 text-goldAccent" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>

                            <h3 class="text-sm font-extrabold text-white">Günün Enerjisi & Notu</h3>

                        </div>

                        <span class="text-[11px] text-gray-400">Otomatik kaydolur</span>

                    </div>



                    <div class="grid grid-cols-3 gap-2 mb-3">

                        <button onclick="setDayMood('zimba')" id="mood-zimba" class="py-2 px-2 rounded-xl border border-borderDark bg-appBg text-xs font-bold text-gray-300 flex flex-col items-center gap-1 transition active:scale-95">
